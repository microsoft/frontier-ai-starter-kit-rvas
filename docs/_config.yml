title: "AI Starter Kit RVAS"
description: "Bring a customer outcome and build a grounded, evaluated Microsoft Foundry agent prototype."
baseurl: "/ai-starter-kit-rvas"
url: "https://microsoft.github.io"

theme: just-the-docs

# Theme configuration
color_scheme: default
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Navigation
nav_sort: case_insensitive
nav_external_links:
  - title: Microsoft Foundry Docs
    url: https://learn.microsoft.com/azure/foundry/
  - title: GitHub Repo
    url: https://github.com/microsoft/frontier-ai-starter-kit-rvas

# Footer
footer_content: "AI Starter Kit RVAS — Built for participants and facilitators"

# Aux links
aux_links:
  "🚀 Open in Codespaces":
    - "https://codespaces.new/microsoft/frontier-ai-starter-kit-rvas?quickstart=1"

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-include-cache

# Build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules/

# Apply just-the-docs default layout to every page that doesn't override it
defaults:
  - scope:
      path: ""
    values:
      layout: default
