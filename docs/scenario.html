<!doctype html>
<html lang="en" data-theme="light">
<head>

  <link rel="stylesheet" href="assets/css/styles.css" />

<body class="scenario-page">
  <header class="nav" role="banner">
    <div class="nav-inner">
      <a class="brand" href="index.html" aria-label="RVAS AI Starter Kit home"><img src="assets/img/logo-full.png" alt="Real Value Acceleration Program" class="brand-logo" /></a>
      <nav class="nav-links" aria-label="Primary">
        <a href="index.html#outcomes">Scenarios</a>
        <a href="idea-forge.html">Idea Forge</a>
        <a href="reference.html">Reference Library</a>
        <a href="guide.html?guide=facilitator-hub">Facilitator Hub</a>
        <a class="gh" href="https://github.com/microsoft/frontier-ai-starter-kit-rvas" target="_blank" rel="noopener">GitHub</a>
      </nav>
      <div class="nav-actions"><button class="icon-btn nav-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button></div>
    </div>
  </header>
  <main>
    <section class="scenario-hero">
      <div class="wrap">
        <a class="back-link" href="index.html#outcomes">← Back to scenarios</a>
        <span class="eyebrow" id="scenarioMaturity">Scenario playbook</span>
        <h1 id="title">Loading scenario…</h1>
        <p id="tagline"></p>
        <div class="scenario-hero-actions">
          <a id="slidesLink" class="btn btn-primary" href="#">Open customer slides</a>
          <a id="acceleratorLink" class="btn btn-ghost" href="#">Open minimal accelerator</a>
          <a id="localDemoLink" class="btn btn-ghost" href="#">Run local demo</a>
        </div>
      </div>
    </section>
    <section class="section-tight">
      <div class="wrap scenario-layout">
        <div class="journey-content">
          <article id="scenarioBody" class="guide-body"><p class="text-dim">Loading playbook…</p></article>
          <nav id="scenarioPager" class="journey-pager" aria-label="Scenario navigation"></nav>
        </div>
        <aside class="scenario-sidebar journey-rail" aria-label="Scenario journey">
          <section class="scenario-panel journey-panel-primary">
            <span class="panel-label">Journey map</span>
            <ol id="buildModuleList" class="journey-steps"></ol>
          </section>
          <section class="scenario-panel">
            <span class="panel-label">Outcome to prove</span>
            <p id="customerOutcome"></p>
          </section>
          <section class="scenario-panel">
            <span class="panel-label">Customer decisions</span>
            <ul id="decisionPrompts"></ul>
          </section>
          <section class="scenario-panel">
            <span class="panel-label">Delivery resources</span>
            <div id="scenarioDeliveryLinks" class="rail-action-list"></div>
          </section>
        </aside>
      </div>
    </section>
  </main>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/scenario.js"></script>
  <script src="assets/js/shell.js"></script>
