name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - CONTRIBUTING.md
      - docs/**
      - activities/**
      - resources/**
      - scripts/action-backend/README.md
      - scripts/audit-docs.js
      - package.json
      - .github/workflows/deploy-pages.yml

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build static site data
        run: npm run build

      - name: Verify generated guides are committed
        run: |
          test -z "$(git status --porcelain --untracked-files=all -- \
            docs/assets/data/activities docs/assets/data/platform.json \
            docs/assets/data/dependency-graph.json docs/resources)"

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
