name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - CONTRIBUTING.md
      - docs/**
      - activities/**
      - resources/**
      - scripts/action-backend/README.md
      - scripts/audit-docs.js
      - package.json
      - .github/workflows/deploy-pages.yml

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    paths:
      - README.md
      - CONTRIBUTING.md
      - docs/**
      - activities/**
      - resources/**
      - scripts/action-backend/README.md
      - scripts/audit-docs.js
      - package.json
      - .github/workflows/deploy-pages.yml

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout pull request head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Build static site data
        run: npm run build

      - name: Verify generated guides are committed
        run: |
          test -z "$(git status --porcelain --untracked-files=all -- \
            docs/assets/data/activities docs/assets/data/platform.json \
            docs/assets/data/dependency-graph.json docs/resources)"

      - name: Upload built site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-site
          path: docs
          retention-days: 1

  deploy-production:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download built site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pages-site
          path: built-site

      - name: Publish production site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add pages-branch origin/gh-pages
          else
            git worktree add --detach pages-branch
            git -C pages-branch checkout --orphan gh-pages
            git -C pages-branch rm -rf .
          fi

          find pages-branch -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'pr-*' -exec rm -rf {} +
          cp -a built-site/. pages-branch/
          touch pages-branch/.nojekyll

          git -C pages-branch add -A
          if ! git -C pages-branch diff --cached --quiet; then
            git -C pages-branch commit -m "Deploy production site from ${GITHUB_SHA}"
            git -C pages-branch push origin HEAD:gh-pages
          fi

  deploy-preview:
    needs: build
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PREVIEW_PREFIX: pr-${{ github.event.pull_request.number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download built site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pages-site
          path: built-site

      - name: Publish pull request preview
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add pages-branch origin/gh-pages
          else
            git worktree add --detach pages-branch
            git -C pages-branch checkout --orphan gh-pages
            git -C pages-branch rm -rf .
          fi

          rm -rf "pages-branch/${PREVIEW_PREFIX}"
          mkdir -p "pages-branch/${PREVIEW_PREFIX}"
          cp -a built-site/. "pages-branch/${PREVIEW_PREFIX}/"
          touch pages-branch/.nojekyll

          git -C pages-branch add -A
          if ! git -C pages-branch diff --cached --quiet; then
            git -C pages-branch commit -m "Deploy preview ${PREVIEW_PREFIX} from ${GITHUB_SHA}"
            git -C pages-branch push origin HEAD:gh-pages
          fi

      - name: Verify GitHub Pages source
        run: |
          set -euo pipefail
          PAGES_SOURCE_BRANCH="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.source.branch // empty')"
          PAGES_BUILD_TYPE="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type // empty')"

          if [ "${PAGES_SOURCE_BRANCH}" != "gh-pages" ] || [ "${PAGES_BUILD_TYPE}" != "legacy" ]; then
            echo "::error::GitHub Pages must deploy from the gh-pages branch and /(root). Update Settings > Pages before publishing pull request previews."
            exit 1
          fi

      - name: Comment preview URL
        run: |
          set -euo pipefail
          SITE_URL="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.html_url')"
          PREVIEW_URL="${SITE_URL%/}/${PREVIEW_PREFIX}/"

          for attempt in $(seq 1 30); do
            if curl --fail --location --silent --show-error --output /dev/null "${PREVIEW_URL}"; then
              break
            fi

            if [ "${attempt}" -eq 30 ]; then
              echo "::error::GitHub Pages did not serve ${PREVIEW_URL} within five minutes."
              exit 1
            fi

            sleep 10
          done

          MARKER="<!-- pages-preview-url -->"
          cat > preview-comment.md <<EOF_COMMENT
          ${MARKER}
          Preview: ${PREVIEW_URL}

          Updated for commit ${GITHUB_SHA}.
          EOF_COMMENT

          COMMENT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"${MARKER}\"))) | .id" | tail -n 1)"
          if [ -n "${COMMENT_ID}" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" -f body="$(cat preview-comment.md)"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$(cat preview-comment.md)"
          fi

  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PREVIEW_PREFIX: pr-${{ github.event.pull_request.number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Remove pull request preview
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            exit 0
          fi

          git fetch origin gh-pages
          git worktree add pages-branch origin/gh-pages
          rm -rf "pages-branch/${PREVIEW_PREFIX}"
          git -C pages-branch add -A

          if ! git -C pages-branch diff --cached --quiet; then
            git -C pages-branch commit -m "Remove preview ${PREVIEW_PREFIX}"
            git -C pages-branch push origin HEAD:gh-pages
          fi
