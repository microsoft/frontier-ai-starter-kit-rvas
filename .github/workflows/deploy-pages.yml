name: Deploy GitHub Pages

on:
  push:
    branches:
      - '**'
    paths:
      - README.md
      - CONTRIBUTING.md
      - docs/**
      - activities/**
      - resources/**
      - scripts/action-backend/README.md
      - scripts/audit-docs.js
      - package.json
      - .github/workflows/deploy-pages.yml

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - README.md
      - CONTRIBUTING.md
      - docs/**
      - activities/**
      - resources/**
      - scripts/action-backend/README.md
      - scripts/audit-docs.js
      - package.json
      - .github/workflows/deploy-pages.yml

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate-pull-request:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Build static site data
        run: npm run build

      - name: Verify generated guides are committed
        run: |
          test -z "$(git status --porcelain --untracked-files=all -- \
            docs/assets/data/activities docs/assets/data/platform.json \
            docs/assets/data/dependency-graph.json docs/resources)"

  build-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Build static site data
        run: npm run build

      - name: Verify generated guides are committed
        run: |
          test -z "$(git status --porcelain --untracked-files=all -- \
            docs/assets/data/activities docs/assets/data/platform.json \
            docs/assets/data/dependency-graph.json docs/resources)"

      - name: Checkout preview state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: preview-state

      - name: Add branch previews
        run: |
          if [ -d preview-state/previews ]; then
            mkdir -p docs/previews
            cp -a preview-state/previews/. docs/previews/
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy-production:
    needs: build-production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

  build-preview:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name != 'pull_request' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      preview_path: ${{ steps.preview_path.outputs.value }}
    steps:
      - name: Checkout production source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: production

      - name: Checkout branch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: preview

      - name: Checkout preview state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: preview-state

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Build production site
        run: npm run build
        working-directory: production

      - name: Build branch preview
        run: npm run build
        working-directory: preview

      - name: Set preview path
        id: preview_path
        env:
          PREVIEW_NAME: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
        run: |
          slug="$(printf '%s' "${PREVIEW_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')"
          suffix="$(printf '%s' "${PREVIEW_NAME}" | sha256sum | cut -c1-10)"
          echo "value=previews/${slug:-branch}-${suffix}" >> "${GITHUB_OUTPUT}"

      - name: Update preview state
        env:
          PREVIEW_PATH: ${{ steps.preview_path.outputs.value }}
        run: |
          rm -rf "preview-state/${PREVIEW_PATH}"
          mkdir -p "preview-state/${PREVIEW_PATH}"
          cp -a preview/docs/. "preview-state/${PREVIEW_PATH}/"

          git -C preview-state config user.name "github-actions[bot]"
          git -C preview-state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C preview-state add -- "${PREVIEW_PATH}"
          if ! git -C preview-state diff --cached --quiet; then
            git -C preview-state commit -m "Update preview for ${PREVIEW_PATH}"
            git -C preview-state push origin HEAD:gh-pages
          fi

      - name: Assemble production site and previews
        run: |
          mkdir site
          cp -a production/docs/. site/
          if [ -d preview-state/previews ]; then
            mkdir -p site/previews
            cp -a preview-state/previews/. site/previews/
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy-preview:
    needs: build-preview
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name != 'pull_request' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      pull-requests: write
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}${{ needs.build-preview.outputs.preview_path }}/"
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Add preview URL to workflow summary
        run: |
          echo "Preview: ${{ steps.deployment.outputs.page_url }}${{ needs.build-preview.outputs.preview_path }}/" >> "${GITHUB_STEP_SUMMARY}"

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_PATH: ${{ needs.build-preview.outputs.preview_path }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          MARKER="<!-- pages-preview-url -->"
          PREVIEW_URL="${SITE_URL}${PREVIEW_PATH}/"
          BODY="${MARKER}
          Preview: ${PREVIEW_URL}

          Updated for commit ${GITHUB_SHA}."
          COMMENT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"${MARKER}\"))) | .id" | tail -n 1)"

          if [ -n "${COMMENT_ID}" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" -f body="${BODY}"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="${BODY}"
          fi
